name: Build Hisab App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Code Download Karo
      uses: actions/checkout@v4

    - name: Files Check Karo
      run: ls -R

    - name: AAB File Save Karo
      uses: actions/upload-artifact@v4
      with:
        name: Hisab-App-AAB
        path: "*.aab"
