name: Build AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build AAB
      run: |
        chmod +x gradlew
        ./gradlew bundleRelease
    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: Hisab-AAB
        path: app/build/outputs/bundle/release/*.aab
